name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]      # 3.13: class bodies carry new dunders (T-0172)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml pytest
      - run: python -m pytest -q tests
      - name: the panel never launches, kills or types (regex denylist)
        run: scripts/check_panel_guard.sh
      - name: the panel package uses only allowlisted imports, no dynamic import, no exec, no write (AST)
        run: scripts/check_panel_ast.py
      - name: the terminal page types into worker panes and nothing else (allowlist over lib/zouinify/term + termctl)
        run: scripts/check_term_guard.sh
      - name: templates only, no private strings
        run: scripts/check_public.sh
